<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8832a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mis Gastos</title>
<style>
:root{--bg:#f6f4f1;--c:#fff;--t:#222;--m:#777;--p:#e8832a;--g:#2fa866;--a:#e0a100;--r:#d94040;--l:#e7e2dc}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--c:#221f1c;--t:#f1ece6;--m:#9b948c;--l:#38332e}}
*{box-sizing:border-box;margin:0}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
header b{font-size:18px;text-transform:capitalize}
header button{background:var(--c);border:1px solid var(--l);color:var(--t);border-radius:10px;width:38px;height:38px;font-size:18px}
main{padding:0 14px;max-width:560px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--l)}
.card h3{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.big{font-size:30px;font-weight:700}.sm{color:var(--m);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.bar{height:8px;background:var(--l);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;background:none;border:0;color:var(--m);font-size:13px}nav .on{color:var(--p);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--c);color:var(--t)}
dialog::backdrop{background:#0007}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 3px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);font-size:16px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:16px;font-weight:700}
.login{text-align:center;margin-top:30vh}
.neg{color:var(--r)}.pos{color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" hidden>+</button>
<nav id="nav" hidden></nav>
<dialog id="dlg"></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {initializeFirestore,persistentLocalCache,collection,doc,addDoc,deleteDoc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1) PEGA AQUÍ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps > Web)
const firebaseConfig={apiKey:"TU_API_KEY",authDomain:"TU_PROYECTO.firebaseapp.com",projectId:"TU_PROYECTO",appId:"TU_APP_ID"};

const app=initializeApp(firebaseConfig);
const USER_ID="gastos-k7q2m9x4"; // debe coincidir con firestore.rules
const db=initializeFirestore(app,{localCache:persistentLocalCache()});

// Valores de tu hoja de cálculo (editables luego en Ajustes)
const DEF={income:1727.14,saveGoal:338.14,wd:60,we:100,extraPay:1400,extraSpend:500,extraMonths:"7,12",savings0:2500,savingsFrom:"2026-11",
 fixed:{"Piso+Wifi":537,"Luz, gas":15,"Limpiadora":20,"Gasolina":45,"Spotify":10,"Gimnasio":22,"Idas a Sev/Cádiz":50,"Ropa":50}};
const VAR=["Desayuno","Comida","Café","Cena","Cervezas","Lotes","Entrada disco","Ubers","Tbc","Supermercado"];
const WEEKEND=[5,6,0]; // vie, sáb, dom = presupuesto "fin de semana"

const $=s=>document.querySelector(s);
const fmt=n=>(n||0).toLocaleString('es-ES',{maximumFractionDigits:2})+' €';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mName=m=>new Date(m+'-15').toLocaleDateString('es-ES',{month:'long',year:'numeric'});
const shift=(m,n)=>{const d=new Date(m+'-15');d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)};
const col=p=>p>=100?'var(--r)':p>=80?'var(--a)':'var(--g)';
const bar=p=>`<div class="bar"><i style="width:${Math.min(Math.max(p,0),100)}%;background:${col(p)}"></i></div>`;
const sum=a=>a.reduce((s,e)=>s+e.amount,0);

let user={uid:USER_ID},cfg=DEF,exps=[],tab='home',month=ymd(new Date()).slice(0,7),unsubs=[];
const fixedBud=()=>Object.values(cfg.fixed).reduce((a,b)=>a+(+b||0),0);
const varBud=()=>4*(cfg.wd+cfg.we); // 640 = 4 × 160, como en tu hoja
const monthExps=m=>exps.filter(e=>e.date.startsWith(m));
const isExtra=m=>String(cfg.extraMonths).split(',').map(Number).includes(+m.slice(5));
const budget=m=>fixedBud()+varBud()+(isExtra(m)?cfg.extraSpend:0);
const income=m=>cfg.income+(isExtra(m)?cfg.extraPay:0);
const goal=m=>cfg.saveGoal+(isExtra(m)?cfg.extraPay-cfg.extraSpend:0);
const proj=()=>{let b=cfg.savings0,cur=ymd(new Date()).slice(0,7),m=cfg.savingsFrom,o=[];
 for(let i=0;i<12;i++,m=shift(m,1)){const ex=monthExps(m),real=m<cur&&ex.length>0,add=real?income(m)-sum(ex):goal(m);b+=add;o.push({m,b,add,real})}return o};
const projCard=()=>{const p=proj(),H=90,lo=Math.min(cfg.savings0,...p.map(x=>x.b)),r=(Math.max(...p.map(x=>x.b))-lo)||1,
 xy=p.map((x,i)=>[10+i*25.4,H-(x.b-lo)/r*H+5]);
 return `<div class="card"><h3>Proyección de ahorro · 12 meses</h3><div class="big pos">${fmt(p[11].b)}</div>
 <div class="sm">desde ${fmt(cfg.savings0)} a inicio de ${mName(cfg.savingsFrom)} · media ${fmt((p[11].b-cfg.savings0)/12)}/mes</div>
 <svg viewBox="0 0 300 100" style="width:100%;margin:8px 0"><polyline points="${xy.map(a=>a.join(',')).join(' ')}" fill="none" stroke="var(--p)" stroke-width="2.5"/>${xy.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="${isExtra(p[i].m)?'var(--g)':'var(--p)'}"/>`).join('')}</svg>
 ${p.map(x=>`<div class="row" style="padding:3px 0"><span class="sm">${new Date(x.m+'-15').toLocaleDateString('es-ES',{month:'short',year:'2-digit'})}${x.real?' ✓':''}${isExtra(x.m)?' ★':''}</span><span class="sm">${x.add>=0?'+':''}${fmt(x.add)}</span><b>${fmt(x.b)}</b></div>`).join('')}
 <div class="sm" style="margin-top:6px">✓ mes real · ★ mes con paga extra</div></div>`};

onSnapshot(collection(db,'users',user.uid,'expenses'),s=>{exps=s.docs.map(d=>({id:d.id,...d.data()}));render()});
onSnapshot(doc(db,'users',user.uid,'meta','config'),s=>{cfg={...DEF,...(s.data()||{})};cfg.fixed={...DEF.fixed,...(s.data()?.fixed||{})};render()});

function render(){
  $('#fab').hidden=$('#nav').hidden=!user;
  $('#nav').innerHTML=[['home','Resumen'],['list','Gastos'],['stats','Estadísticas'],['set','Ajustes']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
  const head=tab=='set'?'<header><b>Ajustes</b><span></span></header>':`<header><button data-m="-1">‹</button><b>${mName(month)}</b><button data-m="1">›</button></header>`;
  $('#app').innerHTML=head+'<main>'+({home,list,stats,set}[tab])()+'</main>';
  $('#app').onclick=e=>{const t=e.target.closest('[data-m],[data-del]');if(!t)return;
    if(t.dataset.m){month=shift(month,+t.dataset.m);render()}
    else if(confirm('¿Borrar este gasto?'))deleteDoc(doc(db,'users',user.uid,'expenses',t.dataset.del))};
  if(tab=='set')bindSettings();
}

function home(){
  const ex=monthExps(month),tot=sum(ex),bud=budget(month),left=bud-tot,p=tot/bud*100;
  const fx=ex.filter(e=>e.cat in cfg.fixed),vr=ex.filter(e=>!(e.cat in cfg.fixed));
  // semana actual
  const now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const wk=exps.filter(e=>e.date>=ymd(mon)&&!(e.cat in cfg.fixed));
  const isWe=e=>WEEKEND.includes(new Date(e.date+'T12:00').getDay());
  const wd=sum(wk.filter(e=>!isWe(e))),we=sum(wk.filter(isWe));
  const saved=income(month)-tot;
  return `<div class="card"><h3>Presupuesto del mes</h3>
    <div class="big ${left<0?'neg':''}">${fmt(left)}</div><div class="sm">${left<0?'te has pasado':'te quedan'} de ${fmt(bud)} · gastado ${fmt(tot)}</div>${bar(p)}</div>
  <div class="card"><h3>Esta semana (gastos variables)</h3>
    <div class="row"><span>Entre semana</span><span>${fmt(wd)} / ${fmt(cfg.wd)}</span></div>${bar(wd/cfg.wd*100)}
    <div class="row"><span>Fin de semana</span><span>${fmt(we)} / ${fmt(cfg.we)}</span></div>${bar(we/cfg.we*100)}</div>
  <div class="card"><h3>Variables del mes</h3><div class="row"><span>${fmt(sum(vr))} de ${fmt(varBud())}</span><span class="sm">${Math.round(sum(vr)/varBud()*100)}%</span></div>${bar(sum(vr)/varBud()*100)}</div>
  <div class="card"><h3>Gastos fijos</h3>${Object.entries(cfg.fixed).map(([c,b])=>{const s=sum(fx.filter(e=>e.cat==c));
    return `<div class="row" style="padding-bottom:0"><span>${esc(c)}</span><span class="sm">${fmt(s)} / ${fmt(b)}</span></div>${bar(b?s/b*100:0)}`}).join('')}</div>
  <div class="card"><h3>Ahorro del mes</h3><div class="big ${saved<goal(month)?'neg':'pos'}">${fmt(saved)}</div><div class="sm">objetivo ${fmt(goal(month))} · ingresos ${fmt(income(month))}${isExtra(month)?' (incluye paga extra)':''}</div></div>`;
}

function list(){
  const ex=monthExps(month).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(!ex.length)return '<div class="card sm">Sin gastos este mes. Pulsa + para añadir.</div>';
  return `<div class="card">${ex.map(e=>`<div class="row" data-del="${e.id}"><div><div>${esc(e.cat)}</div><div class="sm">${e.date.slice(8)}/${e.date.slice(5,7)} ${esc(e.note)}</div></div><b>${fmt(e.amount)}</b></div>`).join('')}</div><p class="sm" style="text-align:center">Toca un gasto para borrarlo</p>`;
}

function stats(){
  const ms=[...Array(6)].map((_,i)=>shift(month,i-5)),vals=ms.map(m=>sum(monthExps(m))),bud=fixedBud()+varBud();
  const mx=Math.max(bud,...vals)*1.1,W=300,H=120;
  const svg=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%">${vals.map((v,i)=>{const h=v/mx*H,x=i*50+9;
    return `<rect x="${x}" y="${H-h}" width="32" height="${h}" rx="5" fill="${v>budget(ms[i])?'var(--r)':'var(--p)'}"/><text x="${x+16}" y="${H+13}" font-size="10" text-anchor="middle" fill="var(--m)">${new Date(ms[i]+'-15').toLocaleDateString('es-ES',{month:'short'})}</text>`}).join('')}
    <line x1="0" x2="${W}" y1="${H-bud/mx*H}" y2="${H-bud/mx*H}" stroke="var(--g)" stroke-dasharray="4"/></svg>`;
  const ex=monthExps(month),by={};ex.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),tot=sum(ex),days=new Date(+month.slice(0,4),+month.slice(5),0).getDate();
  const mine=Math.min(days,month==ymd(new Date()).slice(0,7)?new Date().getDate():days);
  return `<div class="card"><h3>Últimos 6 meses (línea = presupuesto ${fmt(bud)})</h3>${svg}</div>
  <div class="card"><h3>Resumen de ${mName(month)}</h3>
    <div class="row"><span>Total gastado</span><b>${fmt(tot)}</b></div>
    <div class="row"><span>Media diaria</span><b>${fmt(tot/mine)}</b></div>
    <div class="row"><span>Nº de gastos</span><b>${ex.length}</b></div>
    <div class="row"><span>Ahorro real</span><b class="${income(month)-tot<goal(month)?'neg':'pos'}">${fmt(income(month)-tot)}</b></div></div>
  <div class="card"><h3>Por categoría</h3>${cats.map(([c,v])=>`<div class="row" style="padding-bottom:0"><span>${esc(c)}</span><span class="sm">${fmt(v)} · ${Math.round(v/tot*100)}%</span></div><div class="bar"><i style="width:${v/tot*100}%;background:var(--p)"></i></div>`).join('')||'<span class="sm">Sin datos</span>'}</div>`+projCard();
}

function set(){
  return `<div class="card"><h3>Ingresos y objetivos</h3>
  ${[['income','Ingreso mensual neto'],['saveGoal','Objetivo de ahorro mensual'],['wd','Presupuesto semanal entre semana'],['we','Presupuesto semanal fin de semana']].map(([k,l])=>`<label>${l} (€)</label><input data-k="${k}" type="number" step="0.01" value="${cfg[k]}">`).join('')}</div>
  <div class="card"><h3>Paga extra y ahorro</h3>
  <label>Paga extra total (€)</label><input data-k="extraPay" type="number" step="0.01" value="${cfg.extraPay}">
  <label>De ella, gastos previstos (€)</label><input data-k="extraSpend" type="number" step="0.01" value="${cfg.extraSpend}">
  <label>Meses con paga extra (nº de mes separados por coma)</label><input data-k="extraMonths" type="text" value="${cfg.extraMonths}">
  <label>Ahorro acumulado al empezar (€)</label><input data-k="savings0" type="number" step="0.01" value="${cfg.savings0}">
  <label>Mes de ese ahorro inicial</label><input data-k="savingsFrom" type="month" value="${cfg.savingsFrom}"></div>
  <div class="card"><h3>Gastos fijos mensuales</h3>${Object.entries(cfg.fixed).map(([c,b])=>`<label>${esc(c)} (€)</label><input data-f="${esc(c)}" type="number" step="0.01" value="${b}">`).join('')}
  <button class="btn" id="sv">Guardar ajustes</button></div>`;
}
function bindSettings(){
  $('#sv').onclick=async()=>{const n={fixed:{}};
    document.querySelectorAll('[data-k]').forEach(i=>n[i.dataset.k]=i.type=='number'?(+i.value||0):i.value);
    document.querySelectorAll('[data-f]').forEach(i=>n.fixed[i.dataset.f]=+i.value||0);
    await setDoc(doc(db,'users',user.uid,'meta','config'),n);alert('Guardado ✓')};
}

$('#fab').onclick=()=>{
  const d=$('#dlg');
  d.innerHTML=`<h3>Nuevo gasto</h3><label>Importe (€)</label><input id="a" type="number" inputmode="decimal" step="0.01">
  <label>Categoría</label><select id="c"><optgroup label="Variables">${VAR.map(c=>`<option>${c}</option>`).join('')}</optgroup><optgroup label="Fijos">${Object.keys(cfg.fixed).map(c=>`<option>${esc(c)}</option>`).join('')}</optgroup></select>
  <label>Fecha</label><input id="d" type="date" value="${ymd(new Date())}"><label>Nota (opcional)</label><input id="n">
  <button class="btn" id="ok">Guardar</button>`;
  d.showModal();
  $('#ok').onclick=async()=>{const amount=parseFloat($('#a').value);if(!(amount>0))return $('#a').focus();
    await addDoc(collection(db,'users',user.uid,'expenses'),{amount,cat:$('#c').value,date:$('#d').value,note:$('#n').value,ts:Date.now()});
    month=$('#d').value.slice(0,7);d.close()};
};
$('#dlg').onclick=e=>{if(e.target.id=='dlg')e.target.close()};
</script>
</body>
</html>
